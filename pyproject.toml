[project]
name = "runnerbt"
version = "0.1.0"
description = "Backtest and live entry decisions for 5x+ runners on Solana launchpads"
requires-python = ">=3.10"
dependencies = ["zstandard>=0.22"]

[project.optional-dependencies]
live = ["python-socketio[client]>=5.10"]
model = ["numpy>=1.24"]
dev = ["pytest>=7", "numpy>=1.24"]

[project.scripts]
runnerbt = "runnerbt.cli:main"

[tool.setuptools]
packages = ["runnerbt"]
